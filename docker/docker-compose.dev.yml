name: mdm-dev

services:
  api:
    image: mdm-dev-api:latest
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: mdm-dev-api
    restart: unless-stopped
    working_dir: /app/apps/api
    command: ["npx", "tsx", "watch", "--clear-screen=false", "src/index.ts"]
    mem_limit: 512m
    ports:
      - "${DEV_API_PORT:-3001}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=development
      - DATABASE_PATH=${DATABASE_PATH:-/data/dev_app.db}
      - STAGING_PATH=/media_data/downloads/staging
      - MEDIA_PATH=/media_data/media
      - STORAGE_QUOTA_GB=${STORAGE_QUOTA_GB:-150}
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_PUBLIC_URL=${DEV_JELLYFIN_PUBLIC_URL:-http://localhost:8097}
      - JELLYFIN_API_KEY=${DEV_JELLYFIN_API_KEY:-dev-jellyfin-api-key}
      - QBITTORRENT_URL=http://qbittorrent:8080
      - QBITTORRENT_USER=${DEV_QBITTORRENT_USER:-admin}
      - QBITTORRENT_PASSWORD=${DEV_QBITTORRENT_PASSWORD:-adminadmin}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - PROWLARR_URL=${DEV_PROWLARR_URL:-}
      - PROWLARR_API_KEY=${DEV_PROWLARR_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DEV_DISCORD_WEBHOOK_URL:-}
      - JWT_SECRET=${DEV_JWT_SECRET:-dev-jwt-secret-replace-in-production}
      - FRONTEND_URL=${DEV_FRONTEND_URL:-http://localhost:5173}
      - SERVICE_API_KEY=${DEV_SERVICE_API_KEY:-dev-service-api-key}
      - WATCHER_URL=${DEV_WATCHER_URL:-}
      - STREAMER_URL=${DEV_STREAMER_URL:-}
      - MAGIC_LINK_SECRET=${DEV_MAGIC_LINK_SECRET:-dev-magic-link-secret}
    volumes:
      - dev_app_db:/data
      - ../apps/api:/app/apps/api
      - /app/apps/api/node_modules
      - ${DEV_MEDIA_DATA_PATH:-D:/MediaServer/dev_media_data}:/media_data
    depends_on:
      - qbittorrent
      - jellyfin

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: mdm-dev-qbittorrent
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    ports:
      - "${DEV_QBITTORRENT_WEBUI_PORT:-8081}:8080"
      - "${DEV_QBITTORRENT_PORT:-6882}:6881"
      - "${DEV_QBITTORRENT_PORT:-6882}:6881/udp"
    volumes:
      - dev_qbittorrent_config:/config
      - ${DEV_MEDIA_DATA_PATH:-D:/MediaServer/dev_media_data}:/media_data

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: mdm-dev-jellyfin
    restart: unless-stopped
    mem_limit: 768m
    environment:
      - JELLYFIN_PublishedServerUrl=${DEV_JELLYFIN_PublishedServerUrl:-http://localhost:8097}
    ports:
      - "${DEV_JELLYFIN_PORT:-8097}:8096"
    volumes:
      - dev_jellyfin_config:/config
      - dev_jellyfin_cache:/cache
      - ${DEV_MEDIA_DATA_PATH:-D:/MediaServer/dev_media_data}:/media_data:rslave

volumes:
  dev_app_db:
  dev_qbittorrent_config:
  dev_jellyfin_config:
  dev_jellyfin_cache:
