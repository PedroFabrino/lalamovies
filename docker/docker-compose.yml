services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      network: host
    container_name: mdm-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_PATH=${DATABASE_PATH:-/data/app.db}
      - STAGING_PATH=/media_data/downloads/staging
      - MEDIA_PATH=/media_data/media
      - STORAGE_QUOTA_GB=${STORAGE_QUOTA_GB:-150}
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_PUBLIC_URL=${JELLYFIN_PUBLIC_URL:-https://${JELLYFIN_DOMAIN:-watch.lalamovies.stream}}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - QBITTORRENT_URL=http://qbittorrent:8080
      - QBITTORRENT_USER=${QBITTORRENT_USER:-admin}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD:-adminadmin}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-https://lalamovies.stream}
    volumes:
      - app_db:/data
      - ${MEDIA_DATA_PATH:-D:/MediaServer/media_data}:/media_data
    depends_on:
      - qbittorrent
      - jellyfin

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: mdm-qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    ports:
      - "${QBITTORRENT_WEBUI_PORT:-8080}:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./config/qbittorrent:/config
      - ${MEDIA_DATA_PATH:-D:/MediaServer/media_data}:/media_data

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: mdm-jellyfin
    restart: unless-stopped
    environment:
      # When Caddy is used for external HTTPS access, set this to your public domain.
      # For local-only access, leave as http://localhost:8096.
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PublishedServerUrl:-http://localhost:8096}
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - ./config/jellyfin:/config
      - ./cache/jellyfin:/cache
      - ${MEDIA_DATA_PATH:-D:/MediaServer/media_data}:/media_data

  # Caddy acts as a reverse proxy / TLS terminator for Jellyfin ONLY.
  # The Fastify API continues to be exposed via the cloudflared tunnel above.
  # Caddy obtains and auto-renews a free Let's Encrypt certificate for JELLYFIN_DOMAIN.
  # Requires: port 80 and 443 forwarded on your home router to this host.
  caddy:
    image: caddy:latest
    container_name: mdm-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 (QUIC)
    environment:
      - JELLYFIN_DOMAIN=${JELLYFIN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - jellyfin

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mdm-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api

  # Automatically updates the Cloudflare DNS A record for watch.lalamovies.stream
  # whenever the home public IP changes. Checks every 5 minutes.
  # Requires a Cloudflare API token with Zone:DNS:Edit permission for lalamovies.stream.
  ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: mdm-ddns
    restart: unless-stopped
    read_only: true
    cap_drop:
      - all
    environment:
      - CF_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DOMAINS=watch.lalamovies.stream
      - PROXIED=false
      - IP6_PROVIDER=none
      - TZ=${TZ:-UTC}

volumes:
  app_db:
    # Dedicated Docker named volume for SQLite database (app.db) on SSD storage.
    # Decoupled from media storage for high IOPS and zero NTFS lock contention.
  caddy_data:
    # Stores Caddy's TLS certificates and ACME account data (Let's Encrypt).
    # Must be a named volume (not a bind mount) so certificate data survives container recreations.
  caddy_config:
    # Stores Caddy's runtime configuration cache.
