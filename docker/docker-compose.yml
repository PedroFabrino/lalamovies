name: mdm

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      network: host
    container_name: mdm-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_PATH=${DATABASE_PATH:-/data/app.db}
      - STAGING_PATH=/media_data/downloads/staging
      - MEDIA_PATH=/media_data/media
      - STORAGE_QUOTA_GB=${STORAGE_QUOTA_GB:-150}
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_PUBLIC_URL=${JELLYFIN_PUBLIC_URL:-https://${JELLYFIN_DOMAIN:-watch.lalamovies.stream}}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - QBITTORRENT_URL=http://qbittorrent:8080
      - QBITTORRENT_USER=${QBITTORRENT_USER:-admin}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD:-adminadmin}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - PROWLARR_URL=${PROWLARR_URL:-http://prowlarr:9696}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-https://lalamovies.stream}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
      - WATCHER_URL=${WATCHER_URL:-http://mdm-watcher:3001}
      - STREAMER_URL=${STREAMER_URL:-http://mdm-streamer:3002}
      - MAGIC_LINK_SECRET=${MAGIC_LINK_SECRET}
      - WAITLIST_DISCORD_WEBHOOK_URL=${WAITLIST_DISCORD_WEBHOOK_URL}
      - PREFERRED_INDEXER_REGEX=${PREFERRED_INDEXER_REGEX:-}
      - SUBGEN_URL=${SUBGEN_URL:-http://subgen:9000}
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY}
    volumes:
      - app_db:/data
      - ${MEDIA_DATA_PATH:-D:/MediaServer/media_data}:/media_data
    depends_on:
      - qbittorrent
      - jellyfin
      - prowlarr
      - watcher
      - streamer

  watcher:
    build:
      context: ..
      dockerfile: apps/watcher/Dockerfile
      network: host
    container_name: mdm-watcher
    restart: unless-stopped
    environment:
      - PORT=${WATCHER_PORT:-3001}
      - HOST=0.0.0.0
      - NODE_ENV=production
      - WATCHER_DB_PATH=${WATCHER_DB_PATH:-/data/watcher.db}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
      - PROWLARR_URL=${PROWLARR_URL:-http://prowlarr:9696}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - WAITLIST_DISCORD_WEBHOOK_URL=${WAITLIST_DISCORD_WEBHOOK_URL}
      - MAGIC_LINK_SECRET=${MAGIC_LINK_SECRET}
      - MAIN_API_URL=http://api:3000
      - FRONTEND_URL=${FRONTEND_URL:-https://lalamovies.stream}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MOVIE_GRACE_HOURS=${MOVIE_GRACE_HOURS:-6}
      - EPISODE_GRACE_HOURS=${EPISODE_GRACE_HOURS:-0}
      - NEW_RELEASE_THRESHOLD_DAYS=${NEW_RELEASE_THRESHOLD_DAYS:-30}
      - PREFERRED_INDEXER_REGEX=${PREFERRED_INDEXER_REGEX:-}
    volumes:
      - watcher_db:/data
    depends_on:
      - prowlarr

  streamer:
    build:
      context: ..
      dockerfile: apps/streamer/Dockerfile
      network: host
    container_name: mdm-streamer
    restart: unless-stopped
    environment:
      - PORT=${STREAMER_PORT:-3002}
      - HOST=0.0.0.0
      - NODE_ENV=production
      - STREAMER_DB_PATH=${STREAMER_DB_PATH:-/data/streamer.db}
      - SERVICE_API_KEY=${SERVICE_API_KEY}
      - REALDEBRID_API_KEY=${REALDEBRID_API_KEY}
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - MAIN_API_URL=http://api:3000
      - JELLYFIN_PUBLIC_URL=${JELLYFIN_PUBLIC_URL:-https://${JELLYFIN_DOMAIN:-watch.lalamovies.stream}}
      - ZURG_MOUNT_PATH=/media_data/.zurg
      - STREAM_PATH=/media_data/stream
    volumes:
      - streamer_db:/data
      - ${MEDIA_DATA_PATH:-D:/MediaServer/media_data}:/media_data:rslave

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: mdm-qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    ports:
      - "${QBITTORRENT_WEBUI_PORT:-8080}:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./config/qbittorrent:/config
      - ${MEDIA_DATA_PATH:-D:/MediaServer/media_data}:/media_data

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: mdm-jellyfin
    restart: unless-stopped
    environment:
      # When Caddy is used for external HTTPS access, set this to your public domain.
      # For local-only access, leave as http://localhost:8096.
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PublishedServerUrl:-http://localhost:8096}
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - ./config/jellyfin:/config
      - ./cache/jellyfin:/cache
      - ${MEDIA_DATA_PATH:-D:/MediaServer/media_data}:/media_data:rslave
    depends_on:
      - rclone

  zurg:
    image: ghcr.io/debridmediamanager/zurg-testing:latest
    container_name: mdm-zurg
    restart: unless-stopped
    environment:
      - ZURG_TOKEN=${REALDEBRID_API_KEY}
    volumes:
      - ./config/zurg/config.yml:/app/config.yml

  rclone:
    image: rclone/rclone:latest
    container_name: mdm-rclone
    restart: unless-stopped
    environment:
      - RCLONE_CONFIG_ZURG_TYPE=webdav
      - RCLONE_CONFIG_ZURG_URL=http://zurg:9999/dav
      - RCLONE_CONFIG_ZURG_VENDOR=other
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    command: "mount zurg:torrents /media_data/.zurg --allow-other --allow-non-empty --vfs-cache-mode=full --vfs-read-chunk-size=128M --dir-cache-time=10s"
    volumes:
      - ${MEDIA_DATA_PATH:-D:/MediaServer/media_data}:/media_data:rshared
    depends_on:
      - zurg

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: mdm-prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    volumes:
      - ./config/prowlarr:/config

  # Caddy acts as a reverse proxy / TLS terminator for Jellyfin ONLY.
  # The Fastify API continues to be exposed via the cloudflared tunnel above.
  # Caddy obtains and auto-renews a free Let's Encrypt certificate for JELLYFIN_DOMAIN.
  # Requires: port 80 and 443 forwarded on your home router to this host.
  caddy:
    image: caddy:latest
    container_name: mdm-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 (QUIC)
    environment:
      - JELLYFIN_DOMAIN=${JELLYFIN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - jellyfin

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mdm-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api

  # Automatically updates the Cloudflare DNS A record for watch.lalamovies.stream
  # whenever the home public IP changes. Checks every 5 minutes.
  # Requires a Cloudflare API token with Zone:DNS:Edit permission for lalamovies.stream.
  ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: mdm-ddns
    restart: unless-stopped
    read_only: true
    cap_drop:
      - all
    environment:
      - CF_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DOMAINS=watch.lalamovies.stream
      - PROXIED=false
      - IP6_PROVIDER=none
      - TZ=${TZ:-UTC}

  subgen:
    image: mccloud/subgen:latest
    container_name: mdm-subgen
    restart: unless-stopped
    environment:
      - PUID=0
      - PGID=0
      - TRANSCRIBE_DEVICE=cuda
      - WHISPER_MODEL=large-v3
      - TRANSCRIBE_OR_TRANSLATE=translate
      - SUBTITLE_LANGUAGE_NAME=en
      - COMPUTE_TYPE=float16
      - CONCURRENT_TRANSCRIPTIONS=1
      - CLEAR_VRAM_ON_COMPLETE=True
      - MODEL_CLEANUP_DELAY=30
      - WEBHOOK_URL_COMPLETED=http://api:3000/internal/subgen/webhook
    ports:
      - "${SUBGEN_PORT:-9000}:9000"
    volumes:
      - ./config/subgen/models:/subgen/models
      - ${MEDIA_DATA_PATH:-D:/MediaServer/media_data}:/media_data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  app_db:
    name: docker_app_db
  caddy_data:
    name: docker_caddy_data
  caddy_config:
    name: docker_caddy_config
  watcher_db:
    name: docker_watcher_db
  streamer_db:
    name: docker_streamer_db
